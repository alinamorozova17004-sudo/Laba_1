<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скриншоты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="container header-container">
            <div class="logo">
                <div class="logo-icon"></div>
                <span class="logo-text">Скриншоты</span>
            </div>
            <div class="header-right">
                <div class="auth-links">
                    <a href="#" id="openRegisterBtn">Регистрация</a>
                    <a href="#" id="openLoginBtn">Вход</a>
                </div>
                <button class="add-btn">+ Добавить скриншот</button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container">
        <div class="page-header">
            <h1>Июль, 2022</h1>
        </div>

        <div class="cards" id="cardsContainer">
            <!-- Карточки будут добавлены через JS -->
        </div>

        <div class="load-more-wrap">
            <button id="loadMoreBtn" class="load-more-btn">
                <span class="arrow">⌄</span> Показать еще
            </button>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        <div class="container footer-container">
            <a href="mailto:info@gmail.com" class="footer-email">info@gmail.com</a>
            <a href="#" class="footer-dev">Информация о разработчике</a>
        </div>
    </footer>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal">
        <div class="modal-window">
            <button class="close-btn" id="closeModalBtn">&times;</button>

            <!-- Форма ВХОДА -->
            <div class="form-container active" id="loginFormContainer">
                <h2>Вход</h2>
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="loginEmail">E-mail</label>
                        <input type="email" id="loginEmail" name="email" required placeholder="mail@example.com">
                    </div>
                    <div class="form-group">
                        <label for="loginPass">Пароль</label>
                        <input type="password" id="loginPass" name="password" required placeholder="Введите пароль">
                    </div>
                    <button type="submit" class="btn-submit">Войти</button>
                </form>
                <span class="switch-link" id="switchToRegister">Нет аккаунта? Зарегистрироваться</span>
            </div>

            <!-- Форма РЕГИСТРАЦИИ -->
            <div class="form-container" id="registerFormContainer">
                <h2>Регистрация</h2>
                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="regName">Имя</label>
                        <input type="text" id="regName" name="name" required placeholder="Иван Иванов" pattern="^[А-Яа-яЁё\s\-]+$">
                    </div>
                    <div class="form-group">
                        <label for="regEmail">E-mail</label>
                        <input type="email" id="regEmail" name="email" required placeholder="mail@example.com">
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Телефон</label>
                        <input type="tel" id="regPhone" name="phone" required placeholder="+7 (999) 123-45-67" pattern="^(\+7|8)[\s\-]?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}$">
                    </div>
                    <div class="form-group">
                        <label for="regPass">Пароль</label>
                        <input type="password" id="regPass" name="password" required minlength="6" placeholder="Минимум 6 символов">
                    </div>
                    <div class="form-group">
                        <label for="regPassConfirm">Повторите пароль</label>
                        <input type="password" id="regPassConfirm" name="passwordConfirm" required placeholder="Ещё раз">
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="agreeCheck" name="agree" required>
                        <label for="agreeCheck">Согласен на обработку персональных данных</label>
                    </div>
                    <button type="submit" class="btn-submit">Зарегистрироваться</button>
                </form>
                <span class="switch-link" id="switchToLogin">Уже есть аккаунт? Войти</span>
            </div>
        </div>
    </div>

    <script>
        // ========== ДАННЫЕ ==========
        const screenshots = [
            { id: 12, img: 'https://picsum.photos/seed/1/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 11, img: 'https://picsum.photos/seed/2/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 10, img: 'https://picsum.photos/seed/3/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 9, img: 'https://picsum.photos/seed/4/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 8, img: 'https://picsum.photos/seed/5/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 7, img: 'https://picsum.photos/seed/6/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 6, img: 'https://picsum.photos/seed/7/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 5, img: 'https://picsum.photos/seed/8/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 4, img: 'https://picsum.photos/seed/9/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 3, img: 'https://picsum.photos/seed/10/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 2, img: 'https://picsum.photos/seed/11/400/300', date: 'Добавлено 15 августа', link: '#' },
            { id: 1, img: 'https://picsum.photos/seed/12/400/300', date: 'Добавлено 15 августа', link: '#' },
        ];

        // ========== ПАГИНАЦИЯ ==========
        const cardsContainer = document.getElementById('cardsContainer');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        let visibleCount = 0;
        const PORTION = 8; 

        function renderCards() {
            const next = screenshots.slice(visibleCount, visibleCount + PORTION);
            next.forEach(item => {
                const card = document.createElement('article');
                card.className = 'card';
                card.innerHTML = `
                    <a href="${item.link}" class="card-link">
                        <img class="card-img" src="${item.img}" alt="скриншот">
                        <div class="card-date">${item.date}</div>
                    </a>
                `;
                cardsContainer.appendChild(card);
            });
            visibleCount += next.length;
            if (visibleCount >= screenshots.length) {
                loadMoreBtn.style.display = 'none';
            }
        }
        loadMoreBtn.addEventListener('click', renderCards);
        renderCards();

        // ========== МОДАЛЬНОЕ ОКНО ==========
        const modal = document.getElementById('modal');
        const openLoginBtn = document.getElementById('openLoginBtn');
        const openRegisterBtn = document.getElementById('openRegisterBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function openModal() { modal.classList.add('active'); }
        function closeModal() {
            modal.classList.remove('active');
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
            switchToLogin();
        }

        openLoginBtn.addEventListener('click', (e) => { e.preventDefault(); openModal(); });
        openRegisterBtn.addEventListener('click', (e) => { e.preventDefault(); openModal(); switchToRegister(); });
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        // ========== ПЕРЕКЛЮЧЕНИЕ ФОРМ ==========
        const loginContainer = document.getElementById('loginFormContainer');
        const registerContainer = document.getElementById('registerFormContainer');

        function switchToRegister() {
            loginContainer.classList.remove('active');
            registerContainer.classList.add('active');
        }
        function switchToLogin() {
            registerContainer.classList.remove('active');
            loginContainer.classList.add('active');
        }
        document.getElementById('switchToRegister').addEventListener('click', switchToRegister);
        document.getElementById('switchToLogin').addEventListener('click', switchToLogin);

        // ========== СБОР ДАННЫХ ==========
        function getFormData(form) {
            return Object.fromEntries(new FormData(form).entries());
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!this.checkValidity()) { this.reportValidity(); return; }
            console.log('=== Данные входа ===');
            console.log(getFormData(this));
            alert('Вход выполнен (см. консоль)');
            closeModal();
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!this.checkValidity()) { this.reportValidity(); return; }

            const pass = document.getElementById('regPass').value;
            if (/^\d+$/.test(pass)) { alert('Пароль не может состоять только из цифр'); return; }

            const passConfirm = document.getElementById('regPassConfirm').value;
            if (pass !== passConfirm) { alert('Пароли не совпадают!'); return; }

            const agree = document.getElementById('agreeCheck');
            if (!agree.checked) { alert('Необходимо согласие на обработку персональных данных'); return; }

            console.log('=== Данные регистрации ===');
            console.log(getFormData(this));
            alert('Регистрация успешна (см. консоль)');
            closeModal();
        });
    </script>
</body>
</html>
